name: release

# Build the firmware and publish it as a release asset.
#
# Trigger is a version tag, so the flow is: merge the PR into main, then
# tag that commit. CI checks out the tag into a clean tree, which is what
# makes MANIFEST's `dirty=no` meaningful -- a package built on a laptop
# can silently contain uncommitted work, and the old committed
# firmware/bin/ is what that mistake looks like six months later.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# workflow_dispatch is here for dry runs: it builds and uploads the
# archive as a workflow artifact WITHOUT creating a release, so the
# pipeline can be exercised without publishing anything public.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string for a dry-run build (no release created)'
        required: true
        default: 'v0.0.0-dryrun'

# Needed by `gh release create`. Nothing else in this workflow writes.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # package_firmware.sh records the commit in MANIFEST; a shallow
          # clone still resolves HEAD, but full history keeps `git describe`
          # style lookups working if this grows.
          fetch-depth: 0

      # Pinned to the same IDF the repo documents. The build fails on
      # older toolchains and on ones newer than the <6.1 bound in
      # launcher/main/idf_component.yml.
      - name: Build launcher
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: launcher

      - name: Package
        run: |
          set -euo pipefail
          VERSION="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}"
          echo "packaging $VERSION"
          IDF_VERSION=v5.5.5 tools/package_firmware.sh "$VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Always keep the archive, so a dry run is inspectable and a failed
      # release step does not lose the build.
      - name: Upload archive as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-launcher-${{ env.VERSION }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # MANIFEST is the provenance record; put it in the notes so the
          # release page states what the binary was built from.
          {
            echo "Prebuilt launcher firmware for the Waveshare ESP32-S3-Touch-AMOLED-1.8."
            echo
            echo '```'
            cat "dist/esp32-launcher-${VERSION}/MANIFEST"
            echo '```'
            echo
            echo "## Install"
            echo
            echo "No ESP-IDF needed. Download the zip, extract, and run:"
            echo
            echo '```bash'
            echo "./flash.sh"
            echo '```'
            echo
            echo "Or from a checkout of this repo, \`firmware/flash.sh\` fetches this release automatically."
            echo
            echo "## Contents"
            echo
            echo "All four images a complete flash needs, including \`srmodels.bin\` (the speech models at 0x810000)."
            echo "Offsets come from \`bin/OFFSETS\`, generated from the build's own flasher_args.json."
            echo
            echo '```'
            cat "dist/esp32-launcher-${VERSION}/SHA256SUMS"
            echo '```'
          } > notes.md

          gh release create "$VERSION" "dist/esp32-launcher-${VERSION}.zip" \
            --title "Launcher $VERSION" \
            --notes-file notes.md
