name: sim

# Build the headless app simulator and render-test every app. Because the sim
# is pure host code (no ESP-IDF, no board), this runs on a normal Linux runner
# and gates PRs on "every app still loads and draws something".

on:
  push:
    branches: [main]
    paths:
      - 'sim/**'
      - 'apps/**'
      - 'launcher/components/lua_module_lvgl/**'
      - 'launcher/components/lua_module_ui/**'
      - 'launcher/components/display_service/**'
      - 'launcher/components/lua_module_voice/**'
      - 'launcher/components/cap_lua/**'
      - 'launcher/components/fonts_lexend/**'
      - 'launcher/main/app_timer.*'
      - 'launcher/main/app_sandbox.*'
      - 'launcher/components/lua_module_button/**'
      - 'docs/APP_CONTRACT.md'
      - 'tools/check_docs.py'
      - '.github/workflows/sim.yml'
  pull_request:
    paths:
      - 'sim/**'
      - 'apps/**'
      - 'launcher/components/lua_module_lvgl/**'
      - 'launcher/components/lua_module_ui/**'
      - 'launcher/components/display_service/**'
      - 'launcher/components/lua_module_voice/**'
      - 'launcher/components/cap_lua/**'
      - 'launcher/components/fonts_lexend/**'
      - 'launcher/main/app_timer.*'
      - 'launcher/main/app_sandbox.*'
      - 'launcher/components/lua_module_button/**'
      - 'docs/APP_CONTRACT.md'
      - 'tools/check_docs.py'
      - '.github/workflows/sim.yml'
  workflow_dispatch:

jobs:
  render-apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Cheap and needs no build, so it runs before the 270 MB LVGL fetch.
      - name: Docs match the code
        run: ./tools/check_docs.py

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      # LVGL + Lua are cloned into sim/external by setup.sh; cache them so we
      # don't re-clone LVGL (~270 MB checkout) every run. setup.sh skips the
      # clone when the directory already exists.
      - name: Cache third-party sources
        uses: actions/cache@v4
        with:
          path: sim/external
          key: sim-external-${{ hashFiles('sim/setup.sh') }}

      - name: Fetch deps
        run: ./sim/setup.sh

      - name: Build
        run: ./sim/build.sh

      - name: Unit tests (sim internals)
        run: |
          ninja -C sim/build sim_tests
          ./sim/build/sim_tests

      - name: Render-test all apps
        run: ./sim/test.sh

      - name: Scenario assertions
        run: ./sim/scenarios.py

      - name: Golden-frame regression
        run: ./sim/golden.py

      - name: Timer accuracy regression
        run: ./sim/timing_test.py

      - name: Documented widget API still matches the bindings
        run: ./sim/widget_api_test.py

      - name: Fuzz apps with random input
        run: ./sim/fuzz.py --rounds 4 --steps 12 --jobs 4

      - name: Upload rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          # shots/ = test.sh frames; gold_*.png = golden.py's full-size renders,
          # so a golden failure's actual frame is inspectable, not just its %.
          path: |
            sim/build/shots/
            sim/build/gold_*.png
          if-no-files-found: ignore
